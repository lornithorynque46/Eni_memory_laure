<main>
<section class="sectionForm">
<h2>Connectez-vous</h2>
    <fieldset>
        <form action="" method="POST">
            <div>
                <label for="emailFormConnect">Entrez votre adresse mail : </label>
                <input type="email" name="email" id="emailFormConnect" placeholder="ex. :jeandupont@monmail.fr" required title="Renseignez votre adresse mail" pattern="^[a-zA-Z0-9._%+-]+@[a-zA-Z0-9.-]+\.[a-zA-Z]{3,}$">
            </div>
            <div>
                <label for="mdpFormConnect">Votre mot de passe : </label>
                <input type="password" name="mdp" id="mdpFormConnect" required title="Renseignez un mot de passe (min. 6 caractères dont au moins 1 minuscule, 1 symbole et un chiffre)" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"><br/>
                    <small id="small">Au moins 6 caractères dont une minuscule, un symbole et un chiffre.</small>
            </div>
            <div class="btnForm">
                <button type="reset" class="cancel">Annuler</button>
                <button type="submit" class="validate">Se connecter</button>
                            
            </div>
            </form>
    </fieldset>
</section>
</main>
</body>
</html>
